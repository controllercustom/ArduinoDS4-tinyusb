sentence=Arduino library for emulating a PlayStation DualShock 4-style USB HID gamepad on ESP32-S3, RP2040/Pico, SAMD or nRF52840 using TinyUSB.
paragraph=Faithful PlayStation controller emulation with a full 64-byte input report, feature reports for Linux hid-playstation driver enumeration, capacitive touchpad, and LED/rumble callbacks. Single unified library supporting ESP32-S3 (esp32 core), Raspberry Pi Pico (Arduino-Pico core), SAMD21/SAMD51 (Adafruit SAMD core) and nRF52840 (Adafruit nRF52 core).
