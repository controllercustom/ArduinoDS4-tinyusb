name=ArduinoDS4-tinyusb
version=1.1.0
author=controllercustom
maintainer=controllercustom
sentence=Arduino library for emulating a PlayStation DualShock 4-style USB HID gamepad on ESP32-S3, RP2040/Pico, SAMD, nRF52840 or Renesas RA4M1 (Nano R4 / UNO R4 Minima) using TinyUSB.
paragraph=Faithful PlayStation controller emulation with a full 64-byte input report, feature reports for Linux hid-playstation driver enumeration, capacitive touchpad, and LED/rumble callbacks. Single unified library supporting ESP32-S3 (esp32 core), Raspberry Pi Pico (Arduino-Pico core), SAMD21/SAMD51 (Adafruit SAMD core), nRF52840 (Adafruit nRF52 core) and Renesas RA4M1 (arduino:renesas_uno core; run scripts/patch_renesas_core.sh once).
category=Communication
url=https://github.com/controllercustom/ArduinoDS4-tinyusb
architectures=esp32,rp2040,samd,nrf52,renesas_uno
includes=DS4Gamepad.h
tags=usb, gamepad, ds4, playstation, controller, hid, tinyusb, esp32, rp2040, pico, samd, nrf52, nrf52840
